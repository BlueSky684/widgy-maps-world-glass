function legacyCopy(){const f=document.createElement('textarea');f.value=payload;f.readOnly=true;f.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px';document.body.appendChild(f);let ok=false;try{f.focus({preventScroll:true});f.select();f.setSelectionRange(0,f.value.length);ok=document.execCommand('copy');}catch{}finally{f.remove();}if(ok)success();else status.textContent='ההעתקה נחסמה. פתח את העמוד ב־Chrome ונסה שוב, או הורד את הקובץ.';}
button.addEventListener('click',()=>{if(!payload)return;if(!navigator.clipboard||!window.isSecureContext){legacyCopy();return;}navigator.clipboard.writeText(payload).then(success,legacyCopy);});
(async()=>{try{const r=await fetch('../assets/diagnostics/Home_Map_Static_3306x1558.png',{cache:'no-store'});if(!r.ok)throw Error('Map load failed');const bytes=new Uint8Array(await r.arrayBuffer());const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');if(hash!=='c4ccdacd84dec137bd46c6061a4f5b69ed4d210e5cec0bc5e2d08865ffc17df9')throw Error('Map checksum mismatch');let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));widget['1'][0]['22']='function main() { return '+JSON.stringify('data:image/png;base64,'+btoa(binary))+'; }';payload=JSON.stringify(widget);download.href=URL.createObjectURL(new Blob([payload],{type:'application/json'}));download.hidden=false;button.disabled=false;button.textContent='העתקת הווידג׳ט';status.textContent='מוכן להעתקה.';}catch(e){status.textContent='לא ניתן לטעון את המפה המאומתת. נסה לרענן את העמוד.';console.error(e);}})();

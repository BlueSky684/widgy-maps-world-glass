name: Render v141 high-res emissive preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - lib/home-map-v141.js
      - assets/earth/night-network-v141.bin.gz
      - assets/earth/night-body-v141.bin.gz
      - assets/earth/night-core-v141.bin.gz
      - assets/earth/night-provenance-v141.json
      - tools/test-v141-technical.mjs
      - .github/workflows/test-v141-technical.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts=false
      - run: node tools/test-v141-technical.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v141-technical-preview
          path: work/v141-technical/*.png

name: Assemble v142 pixel master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/v142-master-chunks/**
      - .github/workflows/assemble-v142-master.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble lossless pixel master
        run: |
          mkdir -p assets/earth
          cat tools/v142-master-chunks/part-*.b64 | base64 -d > assets/earth/v142-master-native.webp
          echo "dc30ccc9266ce0390f19d8f77f321bdb6144bbaa3b1c3c1a7b4b653560dda489  assets/earth/v142-master-native.webp" | sha256sum -c -
          test "$(stat -c%s assets/earth/v142-master-native.webp)" = "1265746"

      - name: Commit verified master and remove transfer chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/earth/v142-master-native.webp
          git rm -r tools/v142-master-chunks
          git commit -m 'Add v142 approved lossless pixel master'
          git pull --rebase origin main
          git push

name: Assemble v142 pixel master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/v142-master-ready.txt
      - .github/workflows/assemble-v142-master.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble lossless pixel master
        run: |
          mkdir -p assets/earth
          cat tools/v142-master-chunks/part-*.b64 | base64 -d > assets/earth/v142-master-hd.webp
          echo "9fb9af28bbf267aac6c1e8fe3c0f9b8d1eda06c5e3c963413a99afe4a5f51dbf  assets/earth/v142-master-native.webp" | sha256sum -c -
          test "$(stat -c%s assets/earth/v142-master-native.webp)" = "1623572"

      - name: Commit verified master and remove transfer chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/earth/v142-master-hd.webp
          git rm -r tools/v142-master-chunks tools/v142-master-ready.txt
          git commit -m 'Add v142 approved lossless pixel master'
          git pull --rebase origin main
          git push

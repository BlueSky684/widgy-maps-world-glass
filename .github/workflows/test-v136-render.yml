name: Test v136 HD renderer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - lib/home-map-v136.js
      - api/home-map.js
      - assets/earth/night-signal-v136.bin.gz
      - assets/earth/night-provenance-v136.json
      - tools/widgy-v136.json
      - tools/test-v136-render.mjs
      - .github/workflows/test-v136-render.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts=false
      - run: node tools/test-v136-render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v136-preview
          path: work/v136-preview/*.png

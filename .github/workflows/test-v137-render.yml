name: Test v137 approved HD renderer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - lib/home-map-v137.js
      - api/home-map.js
      - assets/earth/night-signal-v137.bin.gz
      - assets/earth/night-provenance-v137.json
      - tools/widgy-v137.json
      - tools/test-v137-render.mjs
      - .github/workflows/test-v137-render.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts=false
      - run: node tools/test-v137-render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v137-preview
          path: work/v137-preview/*.png

name: Test v142 pixel master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/earth/v142-master-native.webp
      - lib/home-map-v142.js
      - tools/test-v142-pixel.mjs
      - .github/workflows/test-v142-pixel.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts=false
      - run: node tools/test-v142-pixel.mjs

name: Build v135 clean night signal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/prepare-night-v135.py
      - .github/workflows/build-v135-night.yml

permissions:
  contents: write

jobs:
  build-night-signal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install builder dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scipy

      - name: Download original NASA Black Marble source
        run: |
          mkdir -p work/map
          curl -L --fail --retry 3 \
            -o work/map/BlackMarble_2016_3km.jpg \
            'https://assets.science.nasa.gov/content/dam/science/esd/eo/images/imagerecords/144000/144898/BlackMarble_2016_3km.jpg'

      - name: Build v135 clean scalar signal from scratch
        run: python tools/prepare-night-v135.py

      - name: Commit generated v135 signal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/earth/night-signal-v135.bin.gz assets/earth/night-provenance-v135.json
          if git diff --cached --quiet; then
            echo 'Generated files are unchanged.'
            exit 0
          fi
          git commit -m 'Build v135 clean night lighting signal'
          git pull --rebase origin main
          git push
